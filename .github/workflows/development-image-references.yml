name: Development image references
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    name: development-image-references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Decide whether image references changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          else
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            if printf '%s\n' "$files" | grep -Eq '^(docker-compose.yml$|scripts/(check-consumer-images|smoke-dev-image).sh$|.github/workflows/development-image-references.yml$)'; then
              echo 'check=true' >> "$GITHUB_OUTPUT"
            else
              echo 'check=false' >> "$GITHUB_OUTPUT"
              echo 'No relevant image changes.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: steps.changed.outputs.check == 'true'
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_CHECK_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        if: steps.changed.outputs.check == 'true'
      - name: Validate Compose, pull selected images and run smoke checks
        if: steps.changed.outputs.check == 'true'
        run: bash scripts/check-consumer-images.sh vue
